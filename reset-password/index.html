<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://fajonmibrspfdozldjap.supabase.co; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Reset password - Grindset</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <script type="module" src="reset.mjs"></script>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main>
    <a class="brand" href="../">Grindset</a>
    <h1 id="title">Reset your password</h1>
    <form id="request-form">
      <p>Enter your account's email. We'll send a link to choose a new password.</p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <button class="button" type="submit">Send reset link</button>
    </form>
    <form id="change-form" hidden>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="confirm">Repeat new password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" required>
      <button class="button" type="submit">Save new password</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript><p>This page needs JavaScript to reset your password.</p></noscript>
    <p class="secondary">Your email and password go only to Grindset's sign-in server. This page has no analytics, cookies or storage.</p>
  </main>
</body>
</html>
